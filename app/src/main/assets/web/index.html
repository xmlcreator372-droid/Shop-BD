<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shop BD | Modern Fashion Ecommerce Platform</title>
  <meta name="description" content="Shop BD is Bangladesh's premier modern fashion ecommerce platform. Shop trendy clothing, shoes, bags, and accessories with fast delivery across Bangladesh.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111827'/><text x='50' y='65' font-family='serif' font-size='50' font-weight='bold' fill='%23D97706' text-anchor='middle'>S</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFFBEB',
              100: '#FEF3C7',
              200: '#FDE68A',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309',
              800: '#92400E',
              900: '#78350F',
            },
            dark: {
              800: '#1E293B',
              900: '#0F172A',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen selection:bg-amber-600 selection:text-white">
  <div id="root">
    <!-- Initial lightweight loading splash -->
    <div class="min-h-screen flex flex-col items-center justify-center bg-white px-4">
      <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center text-amber-500 font-serif font-bold text-3xl shadow-xl animate-pulse mb-4">
        S
      </div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Shop BD</h1>
      <p class="text-xs text-slate-400 mt-1 tracking-widest uppercase">Fashion For A Better You</p>
      <div class="mt-6 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
        <span class="text-xs text-slate-500 font-medium">Loading store...</span>
      </div>
    </div>
  </div>

  <!-- Modular Application Scripts -->
  <script type="text/babel" src="icons.js"></script>
  <script type="text/babel" src="firebaseService.js"></script>
  <script type="text/babel" src="components.js"></script>
  <script type="text/babel" src="userPages.js"></script>
  <script type="text/babel" src="adminPages.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
